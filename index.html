<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to Confluence Converter</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- Mermaid.js for diagram rendering -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ 
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose'
        });
        globalThis.mermaid = mermaid;
    </script>
    <!-- DOMPurify for sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 Markdown to Confluence Converter</h1>
            <p class="subtitle">Convert markdown files with Mermaid diagrams to Confluence-ready format</p>
        </header>

        <div class="upload-section">
            <label for="fileInput" class="file-label">
                <span class="upload-icon">📁</span>
                <span>Choose Markdown File</span>
                <input type="file" id="fileInput" accept=".md,.markdown" />
            </label>
            <div id="fileName" class="file-name"></div>
        </div>

        <div class="confluence-config">
            <h3>⚙️ Confluence Configuration</h3>
            <div class="config-grid">
                <div class="config-field">
                    <label for="confluenceUrl">Confluence URL</label>
                    <input type="text" id="confluenceUrl" placeholder="https://your-domain.atlassian.net" />
                </div>
                <div class="config-field">
                    <label for="clientId">OAuth Client ID</label>
                    <input type="text" id="clientId" placeholder="Your OAuth 2.0 Client ID" />
                    <small><a href="https://developer.atlassian.com/console/myapps/" target="_blank">Register OAuth App</a></small>
                </div>
                <div class="config-field">
                    <label for="clientSecret">OAuth Client Secret</label>
                    <input type="password" id="clientSecret" placeholder="Your OAuth Client Secret" />
                </div>
                <div class="config-field">
                    <label for="cloudId">Cloud ID (optional)</label>
                    <input type="text" id="cloudId" placeholder="Auto-detected after OAuth" />
                </div>
                <div class="config-field">
                    <label for="spaceKey">Space Key</label>
                    <input type="text" id="spaceKey" placeholder="SPACE" />
                </div>
                <div class="config-field">
                    <label for="pageTitle">Page Title</label>
                    <input type="text" id="pageTitle" placeholder="My Documentation Page" />
                </div>
                <div class="config-field">
                    <label for="parentPageId">Parent Page ID (optional)</label>
                    <input type="text" id="parentPageId" placeholder="123456" />
                </div>
                <div class="config-field oauth-status">
                    <label>OAuth Status</label>
                    <div id="oauthStatus" class="status-display">Not connected</div>
                    <button id="authorizeBtn" class="btn btn-primary btn-oauth">
                        <span>🔐</span> Authorize with Confluence
                    </button>
                    <button id="disconnectBtn" class="btn btn-secondary btn-oauth" style="display:none;">
                        <span>🔓</span> Disconnect
                    </button>
                </div>
            </div>
            <div class="config-actions">
                <button id="saveConfigBtn" class="btn btn-secondary">
                    <span>💾</span> Save Config
                </button>
                <button id="loadConfigBtn" class="btn btn-secondary">
                    <span>📂</span> Load Config
                </button>
            </div>
        </div>

        <div class="action-buttons">
            <button id="processBtn" class="btn btn-primary" disabled>
                <span>🔄</span> Process & Save Files
            </button>
            <button id="renderBtn" class="btn btn-secondary" disabled style="display:none;">
                <span>👁️</span> Preview Only
            </button>
            <button id="pushToConfluenceBtn" class="btn btn-success" disabled>
                <span>🚀</span> Push to Confluence
            </button>
            <button id="downloadAllBtn" class="btn btn-success" disabled>
                <span>💾</span> Download All Files
            </button>
            <button id="copyBtn" class="btn btn-secondary" disabled>
                <span>📋</span> Copy for Confluence
            </button>
        </div>
        
        <div id="filesList" class="files-list" style="display:none;">
            <h3>📁 Generated Files</h3>
            <div id="filesContent"></div>
        </div>

        <div class="preview-section">
            <div class="preview-header">
                <h2>Preview</h2>
                <div class="preview-controls">
                    <label>
                        <input type="checkbox" id="showRawHtml" />
                        Show Raw HTML
                    </label>
                </div>
            </div>
            <div id="preview" class="preview-content">
                <div class="placeholder">
                    <p>👆 Select a markdown file to get started</p>
                </div>
            </div>
            <div id="rawHtml" class="raw-html" style="display: none;">
                <pre><code id="rawHtmlContent"></code></pre>
            </div>
        </div>

        <div id="notification" class="notification"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
